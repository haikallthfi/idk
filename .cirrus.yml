env:
    credentials: "ENCRYPTED[023014750463bb8fbf084fd71db3bc03467950f893b5a54e6057f989f2a4c1c1c39fe550e71ea24504674f5aadf10fa8]"
    rcloneconfig_b64: "ENCRYPTED[de9f7cd151552476b7e5c161e77c11cb052938eb438cb1fc028924c026cac4f0a5dfafb20918c68ace1929057c796e35]"
    tokentl: "ENCRYPTED[ecc1c3cbf8bf19e567630ed369abd9a39ab9027f7bcc082aa319acbdb92ec5fbc51d9e0380b230e5472c09bcb35566a9]"
    idtl: "ENCRYPTED[352097e08c05658389e0c8f7c2302708f19d86e14e1c1a9e1a15e98d30f4143ad5c8f6bdb9f73d4882beef5fd419c419]"
    _JAVA_OPTIONS: "-Xmx8g"
    JAVA_OPTS: "-Xmx8g"
    NINJA_ARGS: "-j8"
    XZ_OPT: "-T2"
    lunch: lunch qassa_whyred-user
    make: mka qassa
    LANG: "C.UTF-8"
    LC_ALL: "C.UTF-8"

task:
  name: "Setting Up, Syncing, Building and Uploading..."
  timeout_in: 360m
  container:
      image: memedo/paiskomom:knjt
      cpu: 8
      memory: 32G

  Build-Env-Setup_background_script:
       - export LANG=C.UTF-8
       - export LC_ALL=C.UTF-8
       - export DEBIAN_FRONTEND=noninteractive
       - mkdir -p ~/.config/rclone
       - echo "$rcloneconfig_b64" | base64 -d > ~/.config/rclone/rclone.conf
       - git config --global user.name "paiskomom"
       - git config --global user.email "midooneteam@gmail.com"
       - echo "$credentials" > ~/.git-credentials
       - git config --global credential.helper store --file=~/.git-credentials
       - mkdir -p ~/ccache
       - rclone copy komom:qassa/ccache.tar.gz ~/ -P
       - cd ~/
       - time tar xf ccache.tar.gz
       - rm -f ~/ccache.tar.gz
       - cd ~/

  Storage-Checker_background_script:
      - df -h
      - lsblk
      - ls -l -a -h
      - ./w.sh

  Sync_script:
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="🔄 Start sync Source. . ."
      - mkdir -p ~/rom
      - cd ~/rom
      - sudo curl --create-dirs -L -o /usr/local/bin/repoo -O -L https://storage.googleapis.com/git-repo-downloads/repo
      - sudo chmod a+rx /usr/local/bin/repoo
      - repo init -q --no-repo-verify --depth=1 -u https://github.com/keepQASSA/manifest.git -b Q
      - git clone --depth 1 https://github.com/haikallthfi/local_manifest -b Q .repo/local_manifests
      - sudo apt-get update && sudo apt-get install -y git-lfs && git lfs install
      - rm -rf .repo/repo && git clone https://gerrit.googlesource.com/git-repo .repo/repo
      - repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune --force-sync -j8
      - repo forall -c 'git lfs install && git lfs pull && git lfs checkout'
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="✅ Sync Completed!"
      - sed -i '/private void updateOutlineAlpha() {/,/}/ { /private void updateOutlineAlpha() {/! { /}/!d } }' frameworks/base/packages/SystemUI/src/com/android/systemui/statusbar/notification/row/ActivatableNotificationView.java

      # [Test Fix]
      - |
        echo "⚙️ Menyiapkan patch untuk TunerServiceImpl (CME Fix)..."
        TFILE="frameworks/base/packages/SystemUI/src/com/android/systemui/tuner/TunerServiceImpl.java"

        # 1. Menambahkan Import Concurrent Library
        sed -i 's/import java.util.HashMap;/import java.util.concurrent.ConcurrentHashMap;\nimport java.util.concurrent.CopyOnWriteArraySet;\nimport java.util.HashMap;/g' $TFILE

        # 2. Mengubah tipe data Map & Set menjadi Thread-Safe
        sed -i 's/private final ArrayMap<Uri, String> mListeningUris = new ArrayMap<>();/private final ConcurrentHashMap<Uri, String> mListeningUris = new ConcurrentHashMap<>();/g' $TFILE
        sed -i 's/private final HashMap<String, Set<Tunable>> mTunableLookup = new HashMap<>();/private final ConcurrentHashMap<String, Set<Tunable>> mTunableLookup = new ConcurrentHashMap<>();/g' $TFILE
        sed -i 's/private final HashSet<Tunable> mTunables = LeakDetector.ENABLED ? new HashSet<>() : null;/private final CopyOnWriteArraySet<Tunable> mTunables = LeakDetector.ENABLED ? new CopyOnWriteArraySet<>() : null;/g' $TFILE

        # 3. Mengubah instansiasi Set di dalam method addTunable
        sed -i 's/mTunableLookup.put(key, new ArraySet<Tunable>());/mTunableLookup.put(key, new CopyOnWriteArraySet<Tunable>());/g' $TFILE
        echo "✅ Patch TunerServiceImpl berhasil diinjeksi!"

  Build_script:
      - export BUILD_USERNAME="haikaru17"
      - export BUILD_USER="haikaru17"
      - export BUILD_HOSTNAME="ubuntu"
      - export BUILD_HOST="ubuntu"
      - export WITH_DEXPREOPT=true
      - export WITH_GAPPS=true
      - export TARGET_GAPPS_ARCH=arm64
      - export TARGET_FACE_UNLOCK_SUPPORTED=true
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="🛠️ Boeild qassa Started! https://cirrus-ci.com/build/$CIRRUS_BUILD_ID"
      - ./collect.sh
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="⏳ Build script selesai. Lanjut ke proses upload ccache atau zip ROM."

  Upload_script:
      - |
        if ls ~/rom/out/target/product/whyred/qassa*.zip 1> /dev/null 2>&1; then
            bash upload.sh
            curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="🚀 Build Process Finished!"
        else
            curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="❌ Build Zip not found, skipping rom upload..."
        fi
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="📦 Compressing ccache..."
      - ./ziping.sh
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="📤 Uploading ccache..."
      - rclone copy ~/ccache.tar.gz komom:qassa -P
      - curl -s https://api.telegram.org/bot$tokentl/sendMessage -d chat_id=$idtl -d text="✅ ccache Uploaded Successfully!"
